<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Reel Downloader</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">

  <header class="header">

    <div class="logo">↓</div>

    <div>
      <h1>Reel Downloader</h1>

      <p>
        Download public Instagram Reels quickly.
      </p>
    </div>

  </header>


  <section class="card">

    <label class="input-label" for="urls">
      Instagram Reel links
      <span>One per line</span>
    </label>


    <textarea
      id="urls"
      spellcheck="false"
      placeholder="Paste your Instagram Reel links here...

https://www.instagram.com/reel/ABC123/
https://www.instagram.com/reel/XYZ456/"
    ></textarea>


    <div class="actions">

      <button
        id="downloadBtn"
        type="button"
      >
        ↓ &nbsp; Download All
      </button>

      <button
        id="clearBtn"
        type="button"
      >
        Clear
      </button>

    </div>


    <div
      id="summary"
      class="summary hidden"
    ></div>


    <div
      id="results"
      class="results"
    ></div>


    <p class="note">
      Public Instagram content only.
      Your browser may ask permission for multiple downloads.
    </p>

  </section>

</main>
  <script src="script.js"></script>
</body>
</html>
